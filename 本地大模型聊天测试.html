<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama 本地大模型聊天测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status {
            font-size: 14px;
            opacity: 0.9;
        }

        .config {
            background: #f7f7f7;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .config-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .config-row:last-child {
            margin-bottom: 0;
        }

        .config-row label {
            font-weight: 600;
            min-width: 80px;
            font-size: 14px;
        }

        .config-row input, .config-row select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .config-row button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .config-row button:hover {
            background: #5568d3;
        }

        .quick-links {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .quick-links button {
            padding: 6px 12px;
            font-size: 12px;
            background: #f0f0f0;
            color: #333;
        }

        .quick-links button:hover {
            background: #e0e0e0;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.system .message-content {
            background: #fff3cd;
            color: #856404;
            max-width: 100%;
            font-size: 13px;
        }

        .message.error .message-content {
            background: #ffe0e0;
            color: #d32f2f;
            max-width: 100%;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        .input-box textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .input-box textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-box button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .input-box button:hover {
            background: #5568d3;
        }

        .input-box button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Ollama 本地大模型聊天</h1>
            <div class="status" id="status">等待配置...</div>
        </div>

        <div class="config">
            <div class="config-row">
                <label>服务器地址:</label>
                <input type="text" id="apiUrl" placeholder="例如: http://192.168.1.100:11434">
                <button onclick="testConnection()">测试连接</button>
            </div>
            <div class="quick-links">
                <button onclick="useLocalhost()">本机(localhost)</button>
                <button onclick="detectServer()">自动检测</button>
                <button onclick="clearCache()">清除缓存</button>
            </div>
            <div class="config-row" style="margin-top: 10px;">
                <label>选择模型:</label>
                <select id="modelSelect">
                    <option value="">请先测试连接...</option>
                </select>
                <button onclick="loadModels()">刷新列表</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="messageInput" placeholder="输入你的问题... (回车发送，Shift+回车换行)" rows="2"></textarea>
                <button onclick="sendMessage()" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 配置管理
        const CONFIG_KEY = 'ollama_config';

        // 从 localStorage 加载配置
        function loadConfig() {
            const saved = localStorage.getItem(CONFIG_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    return {};
                }
            }
            return {};
        }

        // 保存配置
        function saveConfig(config) {
            localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        }

        // 清除缓存
        function clearCache() {
            if (confirm('确定要清除所有保存的配置吗？')) {
                localStorage.removeItem(CONFIG_KEY);
                document.getElementById('apiUrl').value = '';
                document.getElementById('modelSelect').innerHTML = '<option value="">请先测试连接...</option>';
                addMessage('system', '配置已清除，请重新设置服务器地址');
            }
        }

        // 使用本机地址
        function useLocalhost() {
            document.getElementById('apiUrl').value = 'http://localhost:11434';
            testConnection();
        }

        // 自动检测服务器
        async function detectServer() {
            addMessage('system', '正在自动检测服务器...\n\n将尝试以下地址：\n1. URL参数中的IP\n2. 上次保存的地址\n3. localhost\n4. 常见局域网IP段');

            // 1. 检查 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            const urlIP = urlParams.get('ip');
            if (urlIP) {
                const url = `http://${urlIP}:11434`;
                addMessage('system', `尝试 URL 参数: ${url}`);
                if (await tryConnection(url)) {
                    document.getElementById('apiUrl').value = url;
                    await testConnection();
                    return;
                }
            }

            // 2. 检查上次保存的地址
            const config = loadConfig();
            if (config.apiUrl) {
                addMessage('system', `尝试上次保存的地址: ${config.apiUrl}`);
                if (await tryConnection(config.apiUrl)) {
                    document.getElementById('apiUrl').value = config.apiUrl;
                    await testConnection();
                    return;
                }
            }

            // 3. 尝试 localhost
            addMessage('system', '尝试 localhost...');
            if (await tryConnection('http://localhost:11434')) {
                document.getElementById('apiUrl').value = 'http://localhost:11434';
                await testConnection();
                return;
            }

            // 4. 尝试 127.0.0.1
            if (await tryConnection('http://127.0.0.1:11434')) {
                document.getElementById('apiUrl').value = 'http://127.0.0.1:11434';
                await testConnection();
                return;
            }

            addMessage('error', '自动检测失败！\n\n请手动输入服务器地址，格式：\nhttp://服务器IP:11434\n\n例如：\nhttp://192.168.1.100:11434\nhttp://10.0.0.184:11434');
        }

        // 尝试连接（不显示UI反馈）
        async function tryConnection(url) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 2000);

                const response = await fetch(`${url}/api/tags`, {
                    signal: controller.signal
                });

                clearTimeout(timeout);
                return response.ok;
            } catch (e) {
                return false;
            }
        }

        // 添加消息
        function addMessage(role, content) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 更新状态
        function setStatus(text, isError = false) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.opacity = isError ? '1' : '0.9';
        }

        // 测试连接
        async function testConnection() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            if (!apiUrl) {
                alert('请输入服务器地址！');
                return;
            }

            setStatus('正在测试连接...');

            try {
                const response = await fetch(`${apiUrl}/api/tags`);
                if (response.ok) {
                    const data = await response.json();
                    setStatus(`✅ 已连接 | ${data.models.length} 个模型`);

                    // 更新模型列表
                    const modelSelect = document.getElementById('modelSelect');
                    modelSelect.innerHTML = '';

                    if (data.models.length === 0) {
                        modelSelect.innerHTML = '<option value="">服务器上没有模型</option>';
                        addMessage('error', '服务器上没有已安装的模型！\n\n请在服务器上运行：\nollama pull qwen3:8b');
                    } else {
                        data.models.forEach(model => {
                            const option = document.createElement('option');
                            option.value = model.name;
                            option.textContent = `${model.name} (${formatSize(model.size)})`;
                            modelSelect.appendChild(option);
                        });

                        // 保存配置
                        saveConfig({
                            apiUrl: apiUrl,
                            models: data.models.map(m => m.name)
                        });

                        addMessage('system', `✅ 连接成功！\n\n服务器地址: ${apiUrl}\n可用模型: ${data.models.length} 个\n\n现在可以开始聊天了！`);
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                setStatus('❌ 连接失败', true);
                addMessage('error', `❌ 连接失败: ${error.message}\n\n请检查：\n1. 服务器地址是否正确（格式: http://IP:11434）\n2. 是否在同一局域网\n3. 服务器防火墙是否开放 11434 端口\n4. Ollama 服务是否正在运行\n\n你可以点击"自动检测"按钮自动查找服务器`);
            }
        }

        // 格式化文件大小
        function formatSize(bytes) {
            const gb = bytes / (1024 * 1024 * 1024);
            if (gb >= 1) return `${gb.toFixed(1)} GB`;
            const mb = bytes / (1024 * 1024);
            return `${mb.toFixed(0)} MB`;
        }

        // 加载模型列表
        async function loadModels() {
            await testConnection();
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            const apiUrl = document.getElementById('apiUrl').value.trim();
            const model = document.getElementById('modelSelect').value;

            if (!apiUrl) {
                alert('请先输入服务器地址并测试连接！');
                return;
            }

            if (!model) {
                alert('请先选择一个模型！');
                return;
            }

            // 显示用户消息
            addMessage('user', message);
            input.value = '';

            // 禁用发送按钮
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<div class="loading"></div>';

            setStatus('🤔 正在思考...');

            try {
                const response = await fetch(`${apiUrl}/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: message,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                addMessage('assistant', data.response);
                setStatus(`✅ 已连接 | 模型: ${model}`);

            } catch (error) {
                addMessage('error', `❌ 发送失败: ${error.message}\n\n可能的原因：\n1. 模型未安装（在服务器运行: ollama pull ${model}）\n2. 网络连接中断\n3. 服务器负载过高\n4. 模型正在加载中`);
                setStatus('❌ 发送失败', true);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        // 回车发送
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 页面加载时初始化
        window.onload = function() {
            addMessage('system', '🎉 欢迎使用 Ollama 本地大模型聊天！\n\n📋 使用说明：\n1. 点击"自动检测"按钮自动查找服务器\n2. 或手动输入服务器地址并点击"测试连接"\n3. 选择要使用的模型\n4. 开始聊天！\n\n💡 提示：\n- 配置会自动保存，下次打开直接可用\n- 可以将此文件分享给其他设备\n- 支持 URL 参数: ?ip=192.168.1.100');

            // 自动检测
            detectServer();
        };
    </script>
</body>
</html>
